<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Playing Cards</title>

</head>

<body>
  <main id="playing-cards">

    <div class="card spade">
      <div class="left">
        <div>A</div>
        <div>♠</div>
      </div>
      <div class="middle">
        <div>♠</div>
      </div>
      <div class="right">
        <div>A</div>
        <div>♠</div>
      </div>
    </div>

    <div class="card club">
      <div class="left">
        <div>5</div>
        <div>♣</div>
      </div>
      <div class="middle">
        <div class="group1">
          <div>♣ ♣</div>
          <div>♣</div>
          <div>♣ ♣</div>
        </div>
      </div>
      <div class="right">
        <div>5</div>
        <div>♣</div>
      </div>
    </div>

    <div class="card heart">
      <div class="left">
        <div>8</div>
        <div>♥</div>
      </div>
      <div class="middle">
        <div class="group2">
          <div>♥ ♥</div>
          <div>♥</div>
          <div>♥ ♥</div>
          <div>♥</div>
          <div>♥ ♥</div>
        </div>
      </div>
      <div class="right">
        <div>8</div>
        <div>♥</div>
      </div>
    </div>

    <div class="card diamond">
      <div class="left">
        <div>10</div>
        <div>♦</div>
      </div>
      <div class="middle group3">
        <div>♦ ♦ ♦ ♦</div>
        <div>♦ ♦</div>
        <div>♦ ♦ ♦ ♦</div>
      </div>
      <div class="right">
        <div>10</div>
        <div>♦</div>
      </div>

    </div>
  </main>
</body>

</html>
