<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Playing Cards</title>
  </head>

  <body>
    <header class="site-header">
      <h1>Playing Cards</h1>
    </header>

    <main id="playing-cards">
      <div class="card spade">
        <div class="left">
          <div>A</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div>A</div>
          <div>♠</div>
        </div>
      </div>

      <div class="card club">
        <div class="left">
          <div>2</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div class="group1">
            <div>♣</div>
            <div>♣</div>
          </div>
        </div>
        <div class="right">
          <div>2</div>
          <div>♣</div>
        </div>
      </div>

      <div class="card heart">
        <div class="left">
          <div>3</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div class="group2">
            <div>♥</div>
            <div>♥</div>
            <div>♥</div>
          </div>
        </div>
        <div class="right">
          <div>3</div>
          <div>♥</div>
        </div>
      </div>

      <div class="card diamond">
        <div class="left">
          <div>4</div>
          <div>♦</div>
        </div>
        <div class="middle group4">
          <div>♦ ♦</div>
          <div>♦ ♦</div>
        </div>
        <div class="right">
          <div>4</div>
          <div>♦</div>
        </div>
      </div>

      <div class="card spade">
        <div class="left">
          <div>5</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♣ ♣</div>
          <div>♣</div>
          <div>♣ ♣</div>
        </div>
        <div class="right">
          <div>5</div>
          <div>♠</div>
        </div>
      </div>

      <div class="card club">
        <div class="left">
          <div>6</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div class="group1">
            <div>♣ ♣</div>
            <div>♣ ♣</div>
            <div>♣ ♣</div>
          </div>
        </div>
        <div class="right">
          <div>6</div>
          <div>♣</div>
        </div>
      </div>

      <div class="card heart">
        <div class="left">
          <div>7</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div class="group2">
            <div>♥ ♥</div>
            <div>♥ ♥</div>
            <div>♥</div>
            <div>♥ ♥</div>
          </div>
        </div>
        <div class="right">
          <div>7</div>
          <div>♥</div>
        </div>
      </div>

      <div class="card heart">
        <div class="left">
          <div>8</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div class="group2">
            <div>♥ ♥</div>
            <div>♥</div>
            <div>♥ ♥</div>
            <div>♥</div>
            <div>♥ ♥</div>
          </div>
        </div>
        <div class="right">
          <div>8</div>
          <div>♥</div>
        </div>
      </div>

      <div class="card diamond">
        <div class="left">
          <div>9</div>
          <div>♦</div>
        </div>
        <div class="middle group3">
          <div>♦ ♦ ♦</div>
          <div>♦ ♦ ♦</div>
          <div>♦ ♦ ♦</div>
        </div>
        <div class="right">
          <div>9</div>
          <div>♦</div>
        </div>
      </div>

      <div class="card diamond">
        <div class="left">
          <div>10</div>
          <div>♦</div>
        </div>
        <div class="middle group3">
          <div>♦ ♦ ♦ ♦</div>
          <div>♦ ♦</div>
          <div>♦ ♦ ♦ ♦</div>
        </div>
        <div class="right">
          <div>10</div>
          <div>♦</div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Playing Cards. All Rights Reserved.</p>
    </footer>
  </body>
</html>
